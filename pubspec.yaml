name: ticketrackr_support
description: "TicketRackr support inside your Flutter app: requests and reports with their forms, the conversation, files, the AI assistant and surveys, with no link out."
version: 0.3.0
homepage: https://ticketrackr.com/docs/support-api#embedded-support
repository: https://github.com/Ticketrackr/ticketrackr-flutter
topics: [support, helpdesk, customer-support, webview]

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      # Android hands files to the system's downloads; iOS needs nothing native.
      android:
        package: com.ticketrackr.support.flutter
        pluginClass: TicketRackrSupportPlugin
      ios:
        dartPluginClass: TicketRackrSupportIOS
